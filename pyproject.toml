[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inat_taxonomy"
version = "0.1.0"
description = "Utilities for accessing the iNaturalist taxonomy via polars dataframes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sam Lapp", email = "sammlapp@gmail.com" }]
dependencies = [
    "polars",
    "platformdirs",
]

[project.urls]
Homepage = "https://github.com/sammlapp/inat_taxonomy"

[tool.setuptools.packages.find]
include = ["inat_taxonomy*"]

[tool.setuptools.package-data]
inat_taxonomy = ["data/*.parquet"]
